<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="Arturo Santos">
    <title>BASIC HTML Structure</title>
</head>

<body>
    <header>
        <img src="images/basic-logo.png" alt="Logo" width="128" height="129">
    </header>
    <nav>
        <ul>
            <li><a href="www.youtube.com">"My videos"</a></li>
            <li><a href="www.facebook.com">"My Socials"</a></li>
        </ul>
    </nav>
    <main>
        <h1>"Basic HTML Structure"</h1>
        <section>
            <h2>"Heading1"</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Aliquam, velit.</p>
        </section>
        <section>
            <h2>"heading2"</h2>
            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Quos, deserunt.</p>
        </section>
        <aside><img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/adelaide-australia/400x250/adelaide-australia-temple-lds-675332-wallpaper.jpg" width="200" alt="Temple at night"></aside>
    </main>
    <footer>
        <p>"Arturo"</p>
    </footer>
</body>

</html>
